services:
  badge-service:
    image: popopx-badge-service:latest
    build:
      context: ../..
      dockerfile: scripts/badge-service/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    restart: on-failure:5
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    tty: true
    network_mode: host
    command:
      - "-d"
      - "${BADGE_DB_CONN:-postgresql://popopx@127.0.0.1:5432/badge_service}"
      - "--create-schema"
      - "--yes-migrate"
      - "--service-config"
      - "/etc/popopx-badge-service/badge_service.ini"
    volumes:
      - ./badge_service.ini:/etc/popopx-badge-service/badge_service.ini:ro
      - ./web:/srv/webapp
    stop_grace_period: 10s
