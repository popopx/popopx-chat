services:
  calculator-bot:
    image: popopx-calculator-bot:latest
    build:
      context: ../..
      dockerfile: scripts/calculator-bot/Dockerfile
    restart: on-failure:5
    # The name must first be registered with the bot address short link.
    # command:
    #   - "--domain"
    #   - "yourname.popopx"
    volumes:
      - calculator-bot-data:/src/apps/popopx-calculator-bot/data

volumes:
  calculator-bot-data:
