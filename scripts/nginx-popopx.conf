server {
    listen 80;
    server_name apivoucherbot.popopxchat.com;

    root /var/www/popopx;
    index index.php index.html;

    # PHP 后端 API
    location ^~ /api/ {
        root /var/www/popopx;
        
        # 所有请求转发到 index.php
        try_files $uri /api/index.php?$query_string;
        
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        }
    }

    # H5 会员购买页
    location ^~ /membership/ {
        root /var/www/popopx;
        
        try_files $uri $uri/ /membership/index.php?$query_string;
        
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        }
    }

    # 主站
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP 处理
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
    }

    # 安全：禁止访问敏感文件
    location ~ /\.(ht|git|env) {
        deny all;
    }
}
